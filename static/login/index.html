<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 伴读精灵</title>
  <link rel="stylesheet" href="/static/login/style.css">
  <script src="/static/login/script.js" defer></script>
</head>
<body>
  <main class="login-card">
    <section class="illustration-panel" aria-label="阅读主题插画">
      <a class="brand" href="/login" aria-label="伴读精灵登录页">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 8C12 5 6 5 3 7v19c4-2 9-2 13 1 4-3 9-3 13-1V7c-3-2-9-2-13 1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 8v19M8 11l4 1M8 16l4 1M21 12l4-1M21 17l4-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>伴读精灵</span>
      </a>
      <div class="illustration-copy"><p>翻开书页，</p><p>与经典相遇。</p><span>让每一次阅读，都有新的发现。</span></div>
      <img class="book-art" src="/static/login/book-illustration.png" alt="古朴书本、翻开的书页与橄榄绿枝叶插画">
      <span class="panel-footnote">A LITTLE READING, A LITTLE WONDER.</span>
    </section>
    <section class="form-panel">
      <span class="language">简体中文 <span aria-hidden="true">⌄</span></span>
      <div class="form-content">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>欢迎回来</h1>
        <p class="intro">登录伴读精灵，继续你的阅读旅程。</p>
        <form action="/login" method="post" id="login-form">
          <input type="hidden" name="csrf" value="{{CSRF}}">
          <div class="field"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" placeholder="请输入用户名" maxlength="100" required></div>
          <div class="field"><label for="password">密码</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button class="password-toggle" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg></button></div></div>
          <p class="error-message" role="alert" aria-live="polite">{{MESSAGE}}</p>
          <button class="submit-button" type="submit">登 录 <span aria-hidden="true">→</span></button>
        </form>
        <p class="reading-note">一页一世界，一书一旅程。</p>
      </div>
      <span class="form-footnote">经典文学 · 智能伴读</span>
    </section>
  </main>
</body>
</html>
