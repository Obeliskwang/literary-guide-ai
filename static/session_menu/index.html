<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; color: #403428; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #list { display: grid; gap: 5px; padding: 1px 0; }
    .session { width: 100%; height: 46px; display: grid; grid-template-columns: 12px minmax(0,1fr); align-items: center; gap: 8px; padding: 0 12px; border: 1px solid transparent; border-radius: 12px; color: #403428; background: transparent; cursor: default; user-select: none; }
    .session:hover { border-color: #dfcfb1; background: rgba(255,250,240,.65); }
    .session.active { background: #fffaf0; box-shadow: 0 7px 18px rgba(82,57,26,.09); }
    .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #a98245; }
    .active .dot { border-color: #403428; background: #403428; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; text-align: left; }
    .rename { width: 100%; height: 32px; padding: 4px 8px; border: 1px solid #a98245; border-radius: 7px; outline: none; color: #403428; background: #fffdf7; font: inherit; }
    .menu { position: absolute; z-index: 10; display: none; width: 112px; padding: 5px; border: 1px solid #dfcfb1; border-radius: 10px; background: #fffdf7; box-shadow: 0 10px 24px rgba(69,47,20,.18); }
    .menu.open { display: grid; }
    .menu button { height: 34px; padding: 0 10px; border: 0; border-radius: 7px; color: #403428; background: transparent; text-align: left; font: inherit; cursor: default; }
    .menu button:hover { background: #f4e5c3; }
    .menu button.danger { color: #a75242; }
  </style>
</head>
<body>
  <div id="list"></div>
  <div id="menu" class="menu" role="menu">
    <button id="rename" type="button" role="menuitem">重命名</button>
    <button id="delete" class="danger" type="button" role="menuitem">删除</button>
  </div>
  <script>
    const list = document.getElementById('list');
    const menu = document.getElementById('menu');
    let sessions = [];
    let activeId = '';
    let contextId = '';
    let sequence = 0;
    let renderSignature = '';

    function post(type, extra = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, '*');
    }
    function resize(extra = 0) {
      post('streamlit:setFrameHeight', { height: Math.max(4, sessions.length * 51 + 2 + extra) });
    }
    function emit(action, sessionId, payload = {}) {
      sequence += 1;
      post('streamlit:setComponentValue', {
        value: { action, session_id: sessionId, event_id: `${Date.now()}-${sequence}`, ...payload },
        dataType: 'json'
      });
    }
    function closeMenu() {
      menu.classList.remove('open');
      contextId = '';
      resize();
    }
    function beginRename(sessionId) {
      closeMenu();
      const row = list.querySelector(`[data-id="${CSS.escape(sessionId)}"]`);
      const session = sessions.find(item => item.id === sessionId);
      if (!row || !session) return;
      const name = row.querySelector('.name');
      const input = document.createElement('input');
      input.className = 'rename';
      input.maxLength = 100;
      input.value = session.name;
      name.replaceWith(input);
      input.focus();
      input.select();
      let finished = false;
      const finish = save => {
        if (finished) return;
        finished = true;
        const value = input.value.trim();
        if (save && value && value !== session.name) emit('rename', sessionId, { name: value });
        else render();
      };
      input.addEventListener('click', event => event.stopPropagation());
      input.addEventListener('contextmenu', event => event.stopPropagation());
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); finish(true); }
        if (event.key === 'Escape') { event.preventDefault(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }
    function render() {
      closeMenu();
      list.replaceChildren();
      sessions.forEach(session => {
        const row = document.createElement('div');
        row.className = 'session' + (session.id === activeId ? ' active' : '');
        row.dataset.id = session.id;
        row.innerHTML = '<span class="dot"></span><span class="name"></span>';
        row.querySelector('.name').textContent = session.name;
        row.addEventListener('click', () => emit('select', session.id));
        row.addEventListener('contextmenu', event => {
          event.preventDefault();
          contextId = session.id;
          menu.style.left = `${Math.min(event.clientX, Math.max(0, document.documentElement.clientWidth - 116))}px`;
          menu.style.top = `${event.clientY + 2}px`;
          menu.classList.add('open');
          resize(82);
        });
        list.appendChild(row);
      });
      resize();
    }
    document.getElementById('rename').addEventListener('click', event => {
      event.stopPropagation();
      if (contextId) beginRename(contextId);
    });
    document.getElementById('delete').addEventListener('click', event => {
      event.stopPropagation();
      if (contextId) emit('delete', contextId);
    });
    document.addEventListener('click', closeMenu);
    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'streamlit:render') return;
      const nextSessions = Array.isArray(event.data.args.sessions) ? event.data.args.sessions : [];
      const nextActiveId = event.data.args.active_id || '';
      const nextSignature = JSON.stringify([nextSessions, nextActiveId]);
      if (nextSignature === renderSignature) return;
      renderSignature = nextSignature;
      sessions = nextSessions;
      activeId = nextActiveId;
      render();
    });
    post('streamlit:componentReady', { apiVersion: 1 });
  </script>
</body>
</html>
